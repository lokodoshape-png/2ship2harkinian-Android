name: Intro video (abertura)

# Makes the opening video the Android app plays before the title menu, from Rafael's own video (his YouTube channel,
# kept on his Google Drive): downloads it, compresses it to H.264/AAC that every Android phone decodes, transcribes
# its speech for the subtitles, and publishes both on the release "intro-video". android.yml puts abertura.mp4 into
# the APK from there, and main.yml puts abertura.mpg (MPEG-1 and MP2, which the PC build's own decoder plays) and
# abertura.srt beside the PC game. The source is set in intro/source.txt; a change to it on a work branch runs this
# again (not on mm3d-4.0, where the release would be replaced while the app builds take it), or run it by hand.

on:
  push:
    branches-ignore: [ mm3d-4.0 ]
    paths:
      - intro/source.txt
  workflow_dispatch:
    inputs:
      only:
        description: "tudo, pc (só abertura.mpg) ou legendas (só a transcrição)"
        type: choice
        options: [ tudo, pc, legendas ]
        default: tudo

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and the transcriber
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --quiet faster-whisper==1.0.3

      - name: Download the video
        run: |
          id=$(grep -v '^#' intro/source.txt | head -1 | tr -d '[:space:]')
          curl -L --fail --retry 4 -o original.mp4 \
            "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
          ls -la original.mp4
          ffprobe -hide_banner original.mp4 2>&1 | tee probe.txt

      - name: Compress (H.264 High 4.1, at most 1920x1080, AAC)
        if: ${{ inputs.only == '' || inputs.only == 'tudo' }}
        run: |
          crf=20
          while :; do
            ffmpeg -hide_banner -loglevel error -y -i original.mp4 \
              -vf "scale='min(1920,iw)':'min(1080,ih)':force_original_aspect_ratio=decrease:flags=lanczos,scale=trunc(iw/2)*2:trunc(ih/2)*2" \
              -c:v libx264 -preset slow -crf $crf -profile:v high -level 4.1 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart abertura.mp4
            size=$(stat -c %s abertura.mp4)
            echo "crf $crf: $size bytes"
            if [ "$size" -lt 90000000 ] || [ "$crf" -ge 30 ]; then break; fi
            crf=$((crf + 2))
          done
          ffprobe -hide_banner abertura.mp4 2>&1 | tee -a probe.txt

      - name: Make the PC version (MPEG-1 1080p, two passes, and MP2)
        if: ${{ inputs.only != 'legendas' }}
        run: |
          # 1080p from the 4K original, two passes at about 8 Mbit/s with B-frames: MPEG-1 needs the bits to stay sharp
          # at full HD. pl_mpeg (IntroVideo.cpp) decodes it.
          vf="scale='min(1920,iw)':'min(1080,ih)':force_original_aspect_ratio=decrease:flags=lanczos,scale=trunc(iw/2)*2:trunc(ih/2)*2"
          ffmpeg -hide_banner -loglevel error -y -i original.mp4 -vf "$vf" \
            -c:v mpeg1video -b:v 8000k -maxrate 12000k -bufsize 8000k -g 12 -bf 2 -mbd rd -trellis 2 -cmp 2 -subcmp 2 \
            -pass 1 -passlogfile mpg -an -f mpeg /dev/null
          ffmpeg -hide_banner -loglevel error -y -i original.mp4 -vf "$vf" \
            -c:v mpeg1video -b:v 8000k -maxrate 12000k -bufsize 8000k -g 12 -bf 2 -mbd rd -trellis 2 -cmp 2 -subcmp 2 \
            -pass 2 -passlogfile mpg -c:a mp2 -b:a 256k -ar 44100 -ac 2 -f mpeg abertura.mpg
          ls -la abertura.mpg
          ffprobe -hide_banner abertura.mpg 2>&1 | tee -a probe.txt

      - name: Transcribe the speech
        if: ${{ inputs.only != 'pc' }}
        run: |
          # The voice is taken out of the music first (demucs), so the lines spoken over the music are heard too; then
          # whisper large-v3 writes it down in Portuguese, without the voice-activity filter that dropped them before.
          # transcricao.srt comes from the voice alone, transcricao_mix.srt from the whole sound, to compare.
          pip install --quiet torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs==4.0.1 soundfile
          ffmpeg -hide_banner -loglevel error -y -i original.mp4 -vn -ac 2 -ar 44100 full.wav
          python3 -m demucs --two-stems vocals -n htdemucs -o sep full.wav
          ffmpeg -hide_banner -loglevel error -y -i sep/htdemucs/full/vocals.wav -ac 1 -ar 16000 voice.wav
          ffmpeg -hide_banner -loglevel error -y -i full.wav -ac 1 -ar 16000 mix.wav
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          def ts(t):
              ms = int(round(t * 1000))
              return "%02d:%02d:%02d,%03d" % (ms // 3600000, ms // 60000 % 60, ms // 1000 % 60, ms % 1000)
          model = WhisperModel("large-v3", device="cpu", compute_type="int8")
          for wav, name in (("voice.wav", "transcricao.srt"), ("mix.wav", "transcricao_mix.srt")):
              segments, info = model.transcribe(wav, language="pt", beam_size=5, condition_on_previous_text=False,
                                                no_speech_threshold=0.45)
              n = 0
              with open(name, "w", encoding="utf-8") as out:
                  for s in segments:
                      text = s.text.strip()
                      if not text:
                          continue
                      n += 1
                      out.write("%d\n%s --> %s\n%s\n\n" % (n, ts(s.start), ts(s.end), text))
              print(name, "segments", n)
          PY
          cat transcricao.srt
          echo ----
          cat transcricao_mix.srt

      - name: Publish on the release intro-video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view intro-video > /dev/null 2>&1 || \
            gh release create intro-video --target "$GITHUB_SHA" --prerelease --title "Vídeo de abertura" \
              --notes "Vídeo de abertura da Definitive Edition (do canal do Rafael), comprimido para o APK, e a transcrição das falas."
          case "${{ inputs.only }}" in
            pc) gh release upload intro-video abertura.mpg --clobber ;;
            legendas) gh release upload intro-video transcricao.srt transcricao_mix.srt --clobber ;;
            *) gh release upload intro-video abertura.mp4 abertura.mpg transcricao.srt transcricao_mix.srt probe.txt \
                 --clobber ;;
          esac
